<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>یوتیوب فارسی</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <div class="logo">▶</div>
    <div>
      <h1>یوتیوب فارسی</h1>
      <p class="sub">اسکیپ تبلیغ + زیرنویس + دوبله زنده</p>
    </div>
  </header>
  <section>
    <h2>تبلیغات</h2>
    <label class="row"><span>اسکیپ خودکار Skip</span><input type="checkbox" id="skipAds" /></label>
    <label class="row"><span>بی‌صدا کردن تبلیغ</span><input type="checkbox" id="muteAds" /></label>
    <label class="row"><span>تند کردن تبلیغ غیرقابل‌اسکیپ</span><input type="checkbox" id="speedAds" /></label>
  </section>
  <section>
    <h2>ترجمه و دوبله</h2>
    <label class="row"><span>زیرنویس فارسی روی ویدیو</span><input type="checkbox" id="translateSubs" /></label>
    <label class="row"><span>نمایش متن اصلی هم</span><input type="checkbox" id="showOriginal" /></label>
    <label class="row"><span>دوبله زنده Gemini Live Translate</span><input type="checkbox" id="liveDub" /></label>
    <label class="block"><span>اندازه زیرنویس: <b id="fontVal">22</b></span><input type="range" id="fontSize" min="14" max="40" step="1" /></label>
    <label class="block">
      <span>موتور زیرنویس متنی</span>
      <select id="translatorEngine">
        <option value="youtube">سریع — یوتیوب</option>
        <option value="google">Google Translate</option>
        <option value="gemini">Gemini Flash-Lite</option>
      </select>
    </label>
    <label class="block"><span>کلید Gemini API</span><input type="password" id="geminiApiKey" placeholder="AIza..." autocomplete="off" /></label>
    <p class="hint">دوبله زنده فقط روی کروم/ادج کار می‌کند و کلید Gemini می‌خواهد. صدای اصلی کم می‌شود و ترجمه گفتاری چند ثانیه عقب پخش می‌شود.</p>
  </section>
  <footer>
    <div>تبلیغ اسکیپ‌شده: <b id="skippedCount">0</b></div>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
