name: Release extension zip

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag like v1.1.3"
        required: true
        default: "v1.1.3"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/generate_icons.py
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build zip
        run: |
          zip -r yt-farsi-helper-${{ steps.ver.outputs.tag }}.zip . \
            -x ".git/*" ".github/*" "*.zip"
          unzip -l yt-farsi-helper-${{ steps.ver.outputs.tag }}.zip | grep icons
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            زیپ افزونه را دانلود کن، Extract کن، بعد Load unpacked.
            پوشه‌ای را انتخاب کن که داخلش manifest.json و پوشه icons هست.
          files: yt-farsi-helper-${{ steps.ver.outputs.tag }}.zip
          generate_release_notes: true
